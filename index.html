<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover allows content to fill edge-to-edge past notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- Mobile Web App & Chrome Fullscreen Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <title>SNS Agro Enterprise Entry System -- By RP Tech</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      /* 100dvh accounts for dynamic address bar resizing in mobile Chrome */
      min-height: 100dvh;
      background-color: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      /* env(safe-area-inset-*) prevents clipping behind notches and nav bars */
      padding: calc(2rem + env(safe-area-inset-top, 0px)) 
               calc(1rem + env(safe-area-inset-right, 0px)) 
               calc(2rem + env(safe-area-inset-bottom, 0px)) 
               calc(1rem + env(safe-area-inset-left, 0px));
      color: #fff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
    }

    .header img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.8rem;
      color: #f6c6ad;
      letter-spacing: 0.4pt;
      text-decoration: underline;
    }

    /* Controls wrapper to place Back and Fullscreen buttons side by side */
    .action-controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
    }

    .action-btn {
      background-color: #1f1f1f;
      border: 1px solid #444;
      color: #f6c6ad;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.2s, filter 0.2s;
    }

    .action-btn:hover {
      background-color: #333;
      filter: brightness(1.1);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .item-card img {
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .title-link {
      font-size: 1.25rem;
      font-weight: bold;
      color: #e8e8e8;
      text-decoration: underline;
    }

    .admin-link {
      font-size: 1rem;
      color: #2e9e3f;
      text-decoration: underline;
    }

    .title-link:hover,
    .admin-link:hover {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <img src="Logo.jpeg" alt="SNS Agro Enterprise Logo">
      <h1>SNS Agro Enterprise Entry System</h1>
    </header>

    <!-- Controls Row: Back button placed to the left of Fullscreen button -->
    <div class="action-controls">
      <button type="button" class="action-btn" onclick="history.back()" aria-label="Go back">
        &#8592; Back
      </button>
      <button type="button" class="action-btn" onclick="toggleFullScreen()">
        ⛶ Fullscreen Mode
      </button>
    </div>

    <section class="item-list">
      <!-- Data Entry -->
      <article class="item-card">
        <img src="sawit.jpg" width="91" height="86" alt="Data Entry">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/SNS_Agro/entry.html">Data Entry</a>
          <a class="admin-link" href="https://ultiga.github.io/SNS_Agro/entry.html">Click to open entry Page</a>
        </div>
      </article>

      <!-- Reporting -->
      <article class="item-card">
        <img src="report.png" width="91" height="86" alt="Reporting">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/SNS_Agro/Report.html">Reporting</a>
          <a class="admin-link" href="https://ultiga.github.io/SNS_Agro/Report.html">Click to Open</a>
        </div>
      </article>


      <!-- Printing -->
      <article class="item-card">
        <img src="print.jpeg" width="91" height="86" alt="Print">
        <div class="item-content">
          <a class="title-link" href="https://docs.google.com/spreadsheets/d/1Cs-tHwvgTIEKvNbSogkJzwYmJepxCtd2/edit?gid=621093011#gid=621093011">Printing</a>
          <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1Cs-tHwvgTIEKvNbSogkJzwYmJepxCtd2/edit?gid=621093011#gid=621093011">Click to Open</a>
        </div>
      </article>



      <!-- Parameter Menu -->
      <article class="item-card">
        <img src="gear.jpeg" width="91" height="86" alt="Parameter Menu">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/SNS_Agro/parameter.html">Parameter Menu</a>
          <a class="admin-link" href="https://ultiga.github.io/SNS_Agro/parameter.html">Click to open</a>
        </div>
      </article>

      

    </section>
  </main>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          console.warn(`Fullscreen request failed: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
