<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS Agro Enterprise Entry System -- By RP Tech</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      background-color: #000;
      color: #fff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
    }

    .header img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 2rem;
      color: #f6c6ad;
      letter-spacing: 0.4pt;
      text-decoration: underline;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .item-card img {
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .title-link {
      font-size: 1.25rem;
      font-weight: bold;
      color: #e8e8e8;
      text-decoration: underline;
    }

    .admin-link {
      font-size: 1rem;
      color: #2e9e3f;
      text-decoration: underline;
    }

    .title-link:hover,
    .admin-link:hover {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <img src="Logo.jpeg" alt="SNS Agro Enterprise Logo">
      <h1>SNS Agro Enterprise Entry System</h1>
    </header>

    <section class="item-list">
      <!-- Data Entry -->
      <article class="item-card">
        <img src="sawit.jpg" width="91" height="86" alt="Data Entry">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/SNS_Agro/entry.html" target="_blank" rel="noopener">Data Entry</a>
          <a class="admin-link" href="https://ultiga.github.io/SNS_Agro/entry.html" target="_blank" rel="noopener">Click to open entry Page</a>
        </div>
      </article>

      <!-- Open/Edit Job Data -->
      <article class="item-card">
        <img src="edit.png" width="82" height="82" alt="Job Data">
        <div class="item-content">
          <a class="title-link" href="https://docs.google.com/spreadsheets/d/1nwUCnkVVr7Js7l0xDuieFmzYyxP1UOWaU2UerED5SN8/edit?usp=sharing" target="_blank" rel="noopener">Open/Edit Job Data</a>
          <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1nwUCnkVVr7Js7l0xDuieFmzYyxP1UOWaU2UerED5SN8/edit?usp=sharing" target="_blank" rel="noopener">Click to open</a>
        </div>
      </article>


      <!-- Open/Edit Emp Data -->
      <article class="item-card">
        <img src="emp.png" width="73" height="73" alt="Employee Data">
        <div class="item-content">
          <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uplB8P24jLqcKOMHUYEevVhvWa6h1by7krrgpyuK4nY/edit?usp=sharing" target="_blank" rel="noopener">Open/Edit Emp Data</a>
          <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1uplB8P24jLqcKOMHUYEevVhvWa6h1by7krrgpyuK4nY/edit?usp=sharing" target="_blank" rel="noopener">Click to Open</a>
        </div>
      </article>


      <!-- Open/Edit Job Type -->
      <article class="item-card">
        <img src="edit1.png" width="54" height="54" alt="Job Type">
        <div class="item-content">
          <a class="title-link" href="https://docs.google.com/spreadsheets/d/1xyenjLEUoT-smBgtpKSy6QvJjDz8JbikQL_dyMVHvlA/edit?usp=sharing" target="_blank" rel="noopener">Open/Edit Job Type</a>
          <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1xyenjLEUoT-smBgtpKSy6QvJjDz8JbikQL_dyMVHvlA/edit?usp=sharing" target="_blank" rel="noopener">Click to Open</a>
        </div>
      </article>

      <!-- Open/Edit Admin List -->
      <article class="item-card">
        <img src="edit2.png" width="58" height="58" alt="Admin List">
        <div class="item-content">
          <a class="title-link" href="https://docs.google.com/spreadsheets/d/1zNBkZ5ihOWBnp-SJzqCUZTc7W6FmFPo6S864MnA9u30/edit?usp=sharing" target="_blank" rel="noopener">Open/Edit Admin List</a>
          <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1zNBkZ5ihOWBnp-SJzqCUZTc7W6FmFPo6S864MnA9u30/edit?usp=sharing" target="_blank" rel="noopener">Click to Open</a>
        </div>
      </article>

      <!-- Reporting -->
      <article class="item-card">
        <img src="report.png" width="71" height="71" alt="Reporting">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/" target="_blank" rel="noopener">Reporting</a>
          <a class="admin-link" href="https://ultiga.github.io/" target="_blank" rel="noopener">Click to Open</a>
        </div>
      </article>

 <!-- Printing -->
      <article class="item-card">
        <img src="print.jpeg" width="71" height="71" alt="Print">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/Dashboard/static.html" target="_blank" rel="noopener">Printing</a>
          <a class="admin-link" href="https://ultiga.github.io/" target="_blank" rel="noopener">Click to Open</a>
        </div>
      </article>







    </section>
  </main>

</body>
</html>
