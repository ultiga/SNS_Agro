<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS Agro Enterprise Reporting Menu -- By RP Tech</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      color: #fff;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 2rem 1rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .header img {
      width: 125px;
      height: 125px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 400;
      color: #ccc;
    }

    .report-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .report-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 0.9rem 1.25rem;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .report-item:hover {
      background-color: #1a1a1a;
      border-color: #333;
    }

    .title-link {
      color: #e8e8e8;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
    }

    .action-link {
      color: #2e9e3f;
      font-size: 0.95rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .title-link:hover,
    .action-link:hover {
      text-decoration: underline;
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <img src="Logo.jpeg" alt="SNS Agro Enterprise Logo">
      <h1>SNS Agro Enterprise Entry System</h1>
      <h2>Reporting Menu</h2>
    </header>

    <section class="report-list">
      <div class="report-item">
        <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Overall Reporting</a>
        <a class="action-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Click to Open</a>
      </div>

      <div class="report-item">
        <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Reporting By Worker</a>
        <a class="action-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Click to Open</a>
      </div>

      <div class="report-item">
        <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Reporting By Work Type</a>
        <a class="action-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Click to Open</a>
      </div>

      <div class="report-item">
        <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Cash Advance Report</a>
        <a class="action-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Click to Open</a>
      </div>

      <div class="report-item">
        <a class="title-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Monthly Salary Report</a>
        <a class="action-link" href="https://docs.google.com/spreadsheets/d/1uYqRqd06mPO54yuCV4j0n88vM6eeN8Xm2TtgmillzGo/edit?gid=782671526#gid=782671526" target="_blank" rel="noopener noreferrer">Click to Open</a>
      </div>
    </section>
  </main>

</body>
</html>
